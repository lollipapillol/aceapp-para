name: Deploy Aceapp Parasitology to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Unzip and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Aceapp ZIP
        id: findzip
        shell: bash
        run: |
          echo "Files in repository root:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "Aceapp-Parasitology*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Aceapp-Parasitology ZIP was found in the repository root."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Unzip Aceapp
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy

          unzip -q "${{ steps.findzip.outputs.zip_file }}" -d deploy

          echo "Extracted files:"
          find deploy -maxdepth 2 -type f | sort

      - name: Verify deployment package
        shell: bash
        run: |
          if [ ! -f "deploy/index.html" ]; then
            echo "ERROR: index.html is missing."
            exit 1
          fi

          if [ ! -f "deploy/sw.js" ]; then
            echo "ERROR: sw.js is missing."
            exit 1
          fi

          if [ ! -f "deploy/manifest.webmanifest" ]; then
            echo "ERROR: manifest.webmanifest is missing."
            exit 1
          fi

          grep -q 'projectId: "aceapp-para"' deploy/index.html || {
            echo "ERROR: The app is not connected to the aceapp-para Firebase project."
            exit 1
          }

          echo "Package verification passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Netlify CLI
        run: npm install --no-save netlify-cli

      - name: Check Netlify secrets
        shell: bash
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "ERROR: NETLIFY_AUTH_TOKEN GitHub secret is missing."
            exit 1
          fi

          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "ERROR: NETLIFY_SITE_ID GitHub secret is missing."
            exit 1
          fi

          echo "Netlify secrets are configured."

      - name: Deploy to Netlify production
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify deploy \
            --dir=deploy \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Aceapp Parasitology production deployment"

      - name: Deployment complete
        run: |
          echo "Aceapp Parasitology deployed successfully."
